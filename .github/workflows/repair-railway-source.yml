name: Repair Railway Source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-railway-source.yml"
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check Railway credential
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ] && [ -z "$RAILWAY_TOKEN" ]; then
            echo "railway-secret=missing"
            exit 42
          fi
          echo "railway-secret=present"

      - name: Link project
        run: railway link --project d89fc116-dd42-4df5-8fa5-23d3bd7a2da7 --environment db29686b-2b6a-4e8c-a063-b46dfc4de9ba --service fea7406f-6e43-49a4-a406-d64a72fce1c6

      - name: Reconnect GitHub source
        run: railway service source connect --repo emadmir68/NabezSardo --branch main --service fea7406f-6e43-49a4-a406-d64a72fce1c6

      - name: Redeploy latest source
        run: railway redeploy --service fea7406f-6e43-49a4-a406-d64a72fce1c6 --yes
