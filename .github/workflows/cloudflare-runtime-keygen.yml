name: Cloudflare Runtime Keygen

on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - "cloudflare/keygen-trigger.txt"

permissions:
  contents: write

jobs:
  keygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      - name: Generate migration keypair
        run: |
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const {publicKey,privateKey}=crypto.generateKeyPairSync('rsa',{
            modulusLength:2048,
            publicKeyEncoding:{type:'spki',format:'pem'},
            privateKeyEncoding:{type:'pkcs8',format:'pem'}
          });
          fs.mkdirSync('cloudflare',{recursive:true});
          fs.writeFileSync('cloudflare/runtime-public-key.pem',publicKey,{mode:0o644});
          fs.writeFileSync('/tmp/nabzesardo-runtime-private.pem',privateKey,{mode:0o600});
          NODE

      - name: Store private key only in Cloudflare secret
        run: npx wrangler secret put RUNTIME_PRIVATE_KEY < /tmp/nabzesardo-runtime-private.pem
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit public key
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/runtime-public-key.pem
          git commit -m "Cloudflare: rotate runtime migration public key"
          git push origin HEAD:cloudflare-migration
