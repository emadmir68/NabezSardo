name: SEO Live Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Nabez Sardo Cloudflare Worker"]
    types: [completed]
    branches: [cloudflare-migration]

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Audit Googlebot-visible SEO surfaces
        env:
          EXPECTED_BUILD: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SEO audit failed at shell line ${LINENO}: ${BASH_COMMAND} (exit ${rc})"; exit "$rc"' ERR
          echo 'seo_audit_stage=wait_for_deployment'
          base='https://nabzesardo.ir'
          googlebot='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          newsbot='Googlebot-News'

          # Wait until the exact pushed revision is live; avoids auditing the previous edge version.
          live=0
          for i in $(seq 1 24); do
            curl -fsS --retry 3 --retry-delay 2 --retry-max-time 45 -A "$googlebot" --max-time 20 "$base/" -o /tmp/revision.html || true
            if grep -q "name=\"nabez-build\" content=\"$EXPECTED_BUILD\"" /tmp/revision.html; then
              live=1
              break
            fi
            sleep 5
          done
          test "$live" = 1
          echo 'seo_audit_stage=fetch_discovery_surfaces'

          curl -fsS --retry 3 --retry-delay 2 --retry-max-time 45 -A "$googlebot" --max-time 30 "$base/robots.txt" -o robots.txt
          curl -fsS --retry 3 --retry-delay 2 --retry-max-time 45 -A "$googlebot" --max-time 30 "$base/sitemap.xml" -o sitemap.xml
          curl -fsS --retry 3 --retry-delay 2 --retry-max-time 45 -A "$newsbot" --max-time 30 "$base/news-sitemap.xml" -o news-sitemap.xml
          curl -fsS --retry 3 --retry-delay 2 --retry-max-time 45 -A "$googlebot" --max-time 30 "$base/feed.xml" -o feed.xml
          curl -fsS --retry 3 --retry-delay 2 --retry-max-time 45 -A "$googlebot" --max-time 30 "$base/" -o home.html
          curl -fsS --retry 3 --retry-delay 2 --retry-max-time 45 -A "$googlebot" --max-time 30 "$base/editorial-policy" -o editorial.html
          curl -fsS --retry 3 --retry-delay 2 --retry-max-time 45 -A "$googlebot" --max-time 30 "$base/about" -o about.html
          curl -fsS --retry 3 --retry-delay 2 --retry-max-time 45 -A "$googlebot" --max-time 30 "$base/contact" -o contact.html
          curl -fsS --retry 3 --retry-delay 2 --retry-max-time 45 -A "$googlebot" --max-time 30 "$base/send-news" -o send-news.html

          echo 'seo_audit_stage=verify_discovery_surfaces'
          grep -q '^Disallow: /admin' robots.txt
          ! grep -q '^Disallow: /search' robots.txt
          grep -q 'Sitemap: https://nabzesardo.ir/sitemap.xml' robots.txt
          grep -q 'Sitemap: https://nabzesardo.ir/news-sitemap.xml' robots.txt
          grep -q '<urlset' sitemap.xml
          grep -q '<urlset' news-sitemap.xml
          grep -q '<rss' feed.xml
          for content_file in home.html feed.xml news-sitemap.xml; do
            if grep -Eqi 'مراسم تشییع و تدفین مرحوم|مراسم تشییع پیکر شهید علی اکبر فیروزی|آگهی ترحیم|رپورتاژ آگهی|محتوای تبلیغاتی' "$content_file"; then
              echo "Forbidden funeral/advertising content is visible to crawlers in $content_file"
              exit 1
            fi
          done

          grep -q 'rel="canonical" href="https://nabzesardo.ir/"' home.html
          grep -q 'name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"' home.html
          grep -q '"@type":"WebSite"' home.html
          grep -q '"@type":"NewsMediaOrganization"' home.html
          grep -q 'rb-brand-mark' home.html
          grep -q 'rel="canonical" href="https://nabzesardo.ir/editorial-policy"' editorial.html
          grep -q 'سیاست تحریریه' editorial.html
          grep -q 'اصلاح' editorial.html
          grep -q 'تحریریه' about.html
          grep -q 'راه ارتباط رسمی' contact.html
          grep -q 'name="robots" content="noindex,follow"' send-news.html

          curl -fsS --retry 3 --retry-delay 2 --retry-max-time 45 -A "$googlebot" --max-time 30 "$base/search?q=seo-audit" -o search.html
          grep -q 'name="robots" content="noindex,follow"' search.html
          curl -fsS --retry 3 --retry-delay 2 --retry-max-time 45 -A "$googlebot" --max-time 30 "$base/all-news?q=seo-audit" -o archive-search.html
          grep -q 'name="robots" content="noindex,follow"' archive-search.html

          echo 'seo_audit_stage=verify_local_pages'
          for p in local/sardouiyeh local/jiroft local/anbarabad local/kahnuj local/south-kerman; do
            code=$(curl -A "$googlebot" -sS --retry 3 --retry-delay 2 --retry-max-time 45 -o /tmp/local.html -w '%{http_code}' --max-time 30 "$base/$p")
            echo "$p status=$code bytes=$(wc -c </tmp/local.html)"
            test "$code" = 200
            grep -q 'rel="canonical"' /tmp/local.html
            grep -q 'application/ld+json' /tmp/local.html
            grep -Eq 'name="robots" content="(index,follow|max-image-preview|noindex,follow)' /tmp/local.html
          done

          follow=$(curl -A "$googlebot" -sS -o /tmp/follow.html -w '%{http_code}' --max-time 30 "$base/follow-up")
          echo "follow_up=$follow"
          test "$follow" = 200
          grep -q 'rel="canonical" href="https://nabzesardo.ir/follow-up"' /tmp/follow.html
          grep -Eq 'name="robots" content="(index,follow|max-image-preview|noindex,follow)' /tmp/follow.html

          slash=$(curl -A "$googlebot" -sS -o /dev/null -w '%{http_code}|%{redirect_url}' --max-time 30 "$base/all-news/")
          echo "trailing_slash=$slash"
          case "$slash" in 301*'https://nabzesardo.ir/all-news'*) ;; *) exit 1 ;; esac

          httpredir=$(curl -A "$googlebot" -sS -o /dev/null -w '%{http_code}|%{redirect_url}' --max-time 30 "http://nabzesardo.ir/")
          echo "http_redirect=$httpredir"
          case "$httpredir" in 301*'https://nabzesardo.ir/'*|302*'https://nabzesardo.ir/'*|307*'https://nabzesardo.ir/'*|308*'https://nabzesardo.ir/'*) ;; *) exit 1 ;; esac

          # Railway is fully retired (owner decision 2026-11-13): the legacy
          # app returns 404. Treat redirect as informational, not a gate.
          legacy=$(curl -A "$googlebot" -sS -o /dev/null -w '%{http_code}|%{redirect_url}' --max-time 90 "https://nabezsardo-prod-production.up.railway.app/")
          echo "legacy_railway_redirect=$legacy"

          if getent ahosts www.nabzesardo.ir >/dev/null 2>&1; then
            wwwredir=$(curl -A "$googlebot" -sS -o /dev/null -w '%{http_code}|%{redirect_url}' --max-time 30 "https://www.nabzesardo.ir/")
            echo "www_redirect=$wwwredir"
            case "$wwwredir" in 301*'https://nabzesardo.ir/'*|302*'https://nabzesardo.ir/'*|307*'https://nabzesardo.ir/'*|308*'https://nabzesardo.ir/'*) ;; *) exit 1 ;; esac
          else
            echo "www_dns=absent (no duplicate host)"
          fi

          echo 'seo_audit_stage=validate_sitemaps'
          python - <<'PY'
          import datetime as dt
          import urllib.parse
          import xml.etree.ElementTree as ET

          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9','i':'http://www.google.com/schemas/sitemap-image/1.1','n':'http://www.google.com/schemas/sitemap-news/0.9'}
          root=ET.parse('sitemap.xml').getroot()
          urls=[x.find('s:loc',ns).text.strip() for x in root.findall('s:url',ns)]
          assert urls, 'empty sitemap'
          assert len(urls)==len(set(urls)), 'duplicate sitemap URLs'
          for url in urls:
            p=urllib.parse.urlsplit(url)
            assert p.scheme=='https' and p.netloc=='nabzesardo.ir', f'noncanonical sitemap host: {url}'
            assert not p.query and not p.fragment, f'parameterized sitemap URL: {url}'
            assert not p.path.startswith(('/admin','/search','/n/')), f'private/duplicate URL in sitemap: {url}'
            assert p.path=='/' or not p.path.endswith('/'), f'trailing slash sitemap URL: {url}'

          news_root=ET.parse('news-sitemap.xml').getroot()
          news_urls=[]
          now=dt.datetime.now(dt.timezone.utc)
          for node in news_root.findall('s:url',ns):
            loc=node.find('s:loc',ns).text.strip()
            news_urls.append(loc)
            assert loc in urls, f'news URL missing from main sitemap: {loc}'
            pd=node.find('.//n:publication_date',ns)
            assert pd is not None and pd.text, f'missing publication date: {loc}'
            when=dt.datetime.fromisoformat(pd.text.replace('Z','+00:00'))
            assert when <= now + dt.timedelta(minutes=10), f'future publication date: {loc}'
            assert when >= now - dt.timedelta(hours=49), f'news sitemap item older than 48h window: {loc}'
          assert len(news_urls)==len(set(news_urls)), 'duplicate news sitemap URLs'
          print(f'sitemap_urls={len(urls)}')
          print(f'news_48h_entries={len(news_urls)}')
          print(f'image_entries={len(root.findall(".//i:image",ns))}')
          first_news=next((u for u in news_urls if '/news/' in u), next((u for u in urls if '/news/' in u), ''))
          open('first-news-url.txt','w').write(first_news)
          PY

          # Exhaustively validate every URL we advertise in the main sitemap.
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root=ET.parse('sitemap.xml').getroot()
          with open('sitemap-urls.txt','w') as f:
            for node in root.findall('s:url',ns):
              f.write(node.find('s:loc',ns).text.strip()+'\n')
          PY
          echo 'seo_audit_stage=validate_all_sitemap_urls'
          while IFS= read -r u; do
            code=000
            for attempt in 1 2 3 4; do
              code=$(curl -A "$googlebot" -sS --retry 2 --retry-delay 2 -o /tmp/sitemap-page.html -w '%{http_code}' --max-time 45 "$u")
              case "$code" in 200) break;; esac
              echo "sitemap_url_retry=$u attempt=$attempt status=$code"
              # back off past the every-minute cron window that can return 503s
              sleep $((attempt * 8))
            done
            echo "sitemap_url=$u status=$code"
            test "$code" = 200
            grep -Fq "rel=\"canonical\" href=\"$u\"" /tmp/sitemap-page.html
            ! grep -q 'name="robots" content="noindex' /tmp/sitemap-page.html
          done < sitemap-urls.txt

          echo 'seo_audit_stage=verify_404_and_news_article'
          notfound=$(curl -A "$googlebot" -sS -o /tmp/notfound.html -w '%{http_code}' --max-time 30 "$base/__seo_audit_missing_page_404")
          echo "missing_page_status=$notfound"
          test "$notfound" = 404

          article=$(cat first-news-url.txt)
          if [ -n "$article" ]; then
            code=$(curl -A "$newsbot" -sS -o article.html -w '%{http_code}' --max-time 30 "$article")
            echo "article=$article status=$code"
            test "$code" = 200
            grep -q "rel=\"canonical\" href=\"$article\"" article.html
            grep -q 'name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"' article.html
            grep -q '"@type":"NewsArticle"' article.html
            grep -q '"datePublished":' article.html
            grep -q '"author":' article.html
            grep -q '"publisher":' article.html
            grep -q 'rb-brand-mark' article.html
            # The approved layout places author/location/date in article-meta-grid.
            grep -q 'rb-article-meta' article.html
            grep -q 'property="article:published_time"' article.html
          fi

          curl -A "$googlebot" -sS -o /dev/null -w 'home_ttfb=%{time_starttransfer} home_total=%{time_total}\n' --max-time 30 "$base/"
