name: Main App Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check app.js
          node --check lib/view-public.js
          node --check lib/view-admin.js
          node --check lib/view-common.js
          node --check lib/article-tools.js

      - name: Production routing probe
        run: |
          for base in "https://nabzesardo.ir" "https://nabezsardo-prod-production.up.railway.app"; do
            echo "BASE=$base"
            health_code=$(curl --silent --show-error --max-time 30 -o /tmp/health.out -w "%{http_code}" "$base/health" || true)
            brief_code=$(curl --silent --show-error --max-time 30 -o /tmp/brief.out -w "%{http_code}" "$base/briefs" || true)
            echo "health_status=$health_code body=$(head -c 220 /tmp/health.out | tr '\n' ' ')"
            echo "briefs_status=$brief_code body=$(head -c 220 /tmp/brief.out | tr '\n' ' ')"
          done
