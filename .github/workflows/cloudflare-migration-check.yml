name: Cloudflare Migration Check

on:
  push:
    branches:
      - cloudflare-migration
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check app.js
          node --check lib/store.js
          node --check lib/analytics.js
          node --check lib/article-tools.js
          node --check lib/auto-cover.js

      - name: Cloudflare bundle dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dist
