name: Publish Gemini design to isolated Cloudflare Worker preview

on:
  push:
    branches:
      - preview/gemini-design-2026-11-21
    paths:
      - ".github/workflows/deploy-gemini-pages-preview.yml"
      - ".github/workflows/validate-gemini-design-package.yml"
      - "nabz-sardo-original-gemini-design.zip"
      - "src/gemini-preview-worker.js"
      - "gemini-source/**"
      - "lib/gemini-bridge.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabzesardo-gemini-worker-staging
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout original design ZIP
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unpack and compile exact original design
        shell: bash
        run: |
          set -euo pipefail
          unzip -q nabz-sardo-original-gemini-design.zip -d /tmp/nabz-gemini-design
          cp -a gemini-source/src/. /tmp/nabz-gemini-design/src/
          cd /tmp/nabz-gemini-design
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -d dist/src/assets/images
          # Cloudflare Workers SPA fallback handles client routing; Pages redirects loop in Workers.
          rm -f dist/_redirects
          # Staging-only: prevent search engines from indexing example stories.
          sed -i '1a\\  X-Robots-Tag: noindex, nofollow, noarchive' dist/_headers
          printf 'User-agent: *\\nDisallow: /\\n' > dist/robots.txt
      - name: Deploy independent static-assets Worker (no production routes)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Cloudflare token missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Cloudflare account missing"; exit 1; }
          mkdir -p .gemini-preview-dist
          cp -a /tmp/nabz-gemini-design/dist/. .gemini-preview-dist/
          cat > wrangler.gemini.preview.toml <<'EOF'
          name = "nabzesardo-gemini-preview-2026"
          main = "./src/gemini-preview-worker.js"
          compatibility_date = "2026-11-01"
          compatibility_flags = ["nodejs_compat"]
          workers_dev = true
          [assets]
          directory = "./.gemini-preview-dist"
          binding = "ASSETS"
          run_worker_first = true
          not_found_handling = "single-page-application"
          [[d1_databases]]
          binding = "DB"
          database_name = "nabzesardo-cloudflare-db"
          database_id = "75ac406c-ba8d-4cf7-a077-f56c7f974601"
          EOF
          npx --yes wrangler@4.102.0 deploy --config wrangler.gemini.preview.toml
          echo "IMPORTANT: no Cloudflare zone route or production domain is configured in this preview Worker."
      - name: Probe published preview page, styles, image, and indexing protection
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://nabzesardo-gemini-preview-2026.emadmir1368.workers.dev"
          curl -fsS --retry 6 --retry-delay 2 "$SITE/" -o /tmp/gemini-preview.html
          grep -q "نبض ساردو" /tmp/gemini-preview.html
          curl -fsSI --retry 6 --retry-delay 2 "$SITE/assets/index-DlIa8MfU.css"
          curl -fsSI --retry 6 --retry-delay 2 "$SITE/src/assets/images/hero_sarduiyeh_highlands_1795255635485.jpg"
          curl -fsS --retry 4 --retry-delay 2 "$SITE/robots.txt" | grep -q 'Disallow: /'
          curl -fsS --retry 4 --retry-delay 2 "$SITE/api/gemini/articles" -o /tmp/gemini-articles.json
          node -e 'const x=require("/tmp/gemini-articles.json");if(x.source!=="cloudflare-d1"||!Array.isArray(x.articles))process.exit(1);console.log("Real D1 articles:",x.articles.length);'
          echo "Preview site, CSS, image and live D1 API are online."
