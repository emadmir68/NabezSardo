name: One Shot Social Connection Test

on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - .github/workflows/social-live-test-once.yml

permissions:
  contents: read

jobs:
  social-test:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger live social test
        run: |
          curl -fsS --retry 3 --retry-delay 2 --max-time 30 \
            https://nabzesardo.ir/__tmp_social_test_9f4c7d2a \
            -o result.json
          cat result.json
      - name: Assert Telegram sent
        run: |
          python - <<'PY'
          import json
          d=json.load(open("result.json"))
          assert d["result"]["telegram"]["status"]=="sent", d
          print("Telegram sent")
          PY
      - name: Assert Rubika sent
        run: |
          python - <<'PY'
          import json
          d=json.load(open("result.json"))
          assert d["result"]["rubika"]["status"]=="sent", d
          print("Rubika sent")
          PY
