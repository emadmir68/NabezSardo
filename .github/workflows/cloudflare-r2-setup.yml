name: Cloudflare R2 Setup

on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - "cloudflare/r2-setup-trigger.txt"

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Ensure media bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          out=$(npx wrangler r2 bucket create nabzesardo-media 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "$out" | grep -Eqi "already exists|already owned|bucket.*exists" || exit "$code"
          fi
          npx wrangler r2 bucket list
