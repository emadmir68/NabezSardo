name: Provision NegahJavan Background Queue

on:
  push:
    branches:
      - infra-provision-negah-20261014
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Create queue and bind NegahJavan consumer
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler queues info negahjavan-background >/dev/null 2>&1; then
            echo "Queue already exists"
          else
            npx wrangler queues create negahjavan-background
          fi
          npx wrangler queues consumer worker remove negahjavan-background negahjavan >/dev/null 2>&1 || true
          npx wrangler queues consumer worker add negahjavan-background negahjavan --batch-size 1 --batch-timeout 5 --message-retries 3 --max-concurrency 1 --retry-delay-secs 60
          npx wrangler queues info negahjavan-background
          npx wrangler queues consumer worker list negahjavan-background
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
