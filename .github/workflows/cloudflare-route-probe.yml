name: Cloudflare Route Probe

on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - "cloudflare/probe-trigger.txt"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production public routes
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            name="$1"
            url="$2"
            code=$(curl --silent --show-error --max-time 30 -o "/tmp/$name.out" -w "%{http_code}" "$url" || true)
            bytes=$(wc -c < "/tmp/$name.out" 2>/dev/null || echo 0)
            echo "$name status=$code bytes=$bytes"
            test "$code" = "200"
          }
          probe health "https://nabzesardo.ir/health"
          probe home "https://nabzesardo.ir/"
          probe archive "https://nabzesardo.ir/all-news"
          probe robots "https://nabzesardo.ir/robots.txt"
          probe sitemap "https://nabzesardo.ir/sitemap.xml"
          probe news_sitemap "https://nabzesardo.ir/news-sitemap.xml"
          probe feed "https://nabzesardo.ir/feed.xml"
          probe live_stats "https://nabzesardo.ir/api/live-stats"
          probe admin_login "https://nabzesardo.ir/admin/login"
