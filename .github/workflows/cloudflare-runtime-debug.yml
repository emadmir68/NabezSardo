name: Cloudflare Runtime Debug

on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - "cloudflare/runtime-debug-trigger.txt"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Tail Worker and reproduce runtime failure
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          timeout 25s npx wrangler tail nabzesardo-cloudflare --format=json > /tmp/tail.log 2>&1 &
          TAIL_PID=$!
          sleep 5
          curl --silent --show-error --max-time 30 -H 'x-nabzesardo-debug: admdbg-9f13c7b0f4e643e8' -D /tmp/headers -o /tmp/body https://nabzesardo.ir/__debug/admin
          echo "---- response ----"
          cat /tmp/headers || true
          cat /tmp/body || true
          echo
          sleep 5
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          echo "---- worker tail ----"
          cat /tmp/tail.log || true
