name: Verify Talebi Category

on:
  push:
    branches:
      - diagnostic/news-monitor-live
    paths:
      - ".github/workflows/verify-talebi-category.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Check live D1 category
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute nabzesardo-cloudflare-db --remote --command="SELECT json_extract(j.value,'$.id') AS id, json_extract(j.value,'$.title') AS title, json_extract(j.value,'$.categoryId') AS category_id FROM app_state, json_each(app_state.value,'$.articles') AS j WHERE app_state.key='db' AND json_extract(j.value,'$.title') LIKE '%دانش‌آموزان برتر علمی و فرهنگی کرمان%' LIMIT 5;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
