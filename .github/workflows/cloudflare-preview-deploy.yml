name: Cloudflare Preflight

on:
  push:
    branches:
      - cloudflare-migration
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Cloudflare production branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Validate Worker build
        run: npx wrangler deploy --dry-run --outdir /tmp/nabez-worker-build

      - name: Verify production public routes
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://nabzesardo.ir"
          curl -fsS --retry 3 --retry-delay 2 "$SITE/health" -o /tmp/health.json
          curl -fsS --retry 3 --retry-delay 2 "$SITE/" -o /tmp/home.html
          curl -fsS --retry 3 --retry-delay 2 "$SITE/all-news" -o /tmp/archive.html
          curl -fsS --retry 3 --retry-delay 2 "$SITE/robots.txt" -o /tmp/robots.txt
          grep -q '"ok":true' /tmp/health.json
          grep -q 'نبض ساردو' /tmp/home.html
          grep -q 'نبض ساردو' /tmp/archive.html
          grep -q 'Sitemap: https://nabzesardo.ir/sitemap.xml' /tmp/robots.txt
