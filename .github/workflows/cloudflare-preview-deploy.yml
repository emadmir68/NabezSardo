name: Deploy Cloudflare Preview

on:
  push:
    branches:
      - cloudflare-migration
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Cloudflare migration branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy preview Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify migrated D1 state
        run: |
          npx wrangler d1 execute nabzesardo-cloudflare-db --remote --command="SELECT key, value FROM app_state WHERE key IN ('migration_complete','migration_source_sha256') ORDER BY key;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test preview
        run: |
          curl --fail --silent --show-error --max-time 30 https://nabzesardo-cloudflare.emadmir1368.workers.dev/ -o /tmp/home.html
          curl --fail --silent --show-error --max-time 30 https://nabzesardo-cloudflare.emadmir1368.workers.dev/all-news -o /tmp/all-news.html
          curl --fail --silent --show-error --max-time 30 https://nabzesardo-cloudflare.emadmir1368.workers.dev/__migration -o /tmp/migration.html
          curl --fail --silent --show-error --max-time 60 -X POST https://nabzesardo-cloudflare.emadmir1368.workers.dev/__sync/public-pull -o /tmp/public-pull.json
          curl --fail --silent --show-error --max-time 30 https://nabzesardo-cloudflare.emadmir1368.workers.dev/__sync/status -o /tmp/sync-status.json
          curl --fail --silent --show-error --max-time 30 https://nabzesardo.ir/health -o /tmp/custom-health.json
          curl --fail --silent --show-error --max-time 30 https://nabzesardo.ir/ -o /tmp/custom-home.html
          curl --fail --silent --show-error --max-time 30 "https://nabzesardo-cloudflare.emadmir1368.workers.dev/news/%D8%B3%D8%A7%D8%B9%D8%AA-%D9%81%D8%B9%D8%A7%D9%84%DB%8C%D8%AA-%D9%85%D8%AF%D8%A7%D8%B1%D8%B3-%DA%A9%D8%B1%D9%85%D8%A7%D9%86-%D8%AF%D8%B1-%D8%AF%D9%88-%D9%87%D9%81%D8%AA%D9%87-%D8%A7%D8%A8%D8%AA%D8%AF%D8%A7%DB%8C%DB%8C-%D9%85%D9%87%D8%B1-%D8%A7%D8%B9%D9%84%D8%A7%D9%85-%D8%B4%D8%AF" -o /tmp/article.html
          curl --fail --silent --show-error --max-time 30 https://nabzesardo-cloudflare.emadmir1368.workers.dev/uploads/featured-mub33kth-7751091527b8.webp -o /tmp/media.webp
          grep -q '"ok":true' /tmp/public-pull.json
          grep -q '"ok":true' /tmp/sync-status.json
          grep -q '"name":"nabzesardo-cloudflare"' /tmp/custom-health.json
          grep -q "نبض ساردو" /tmp/custom-home.html
          grep -q "نبض ساردو" /tmp/home.html
          grep -q "migration" /tmp/migration.html || grep -q "انتقال" /tmp/migration.html
          echo "home_bytes=$(wc -c < /tmp/home.html)"
          echo "all_news_bytes=$(wc -c < /tmp/all-news.html)"
          grep -q "ساعت فعالیت مدارس کرمان" /tmp/article.html
          test "$(wc -c < /tmp/media.webp)" -gt 1000
          echo "migration_bytes=$(wc -c < /tmp/migration.html)"
          echo "public_pull=$(cat /tmp/public-pull.json)"
          echo "sync_status=$(cat /tmp/sync-status.json)"
          echo "custom_health=$(cat /tmp/custom-health.json)"
          echo "custom_home_bytes=$(wc -c < /tmp/custom-home.html)"
          echo "article_bytes=$(wc -c < /tmp/article.html)"
          echo "media_bytes=$(wc -c < /tmp/media.webp)"
