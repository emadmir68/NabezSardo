name: Lighthouse Day 1

on:
  push:
    branches:
      - seo-day1-image-local-links
    paths:
      - .github/workflows/lighthouse-day1.yml

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Mobile and desktop Lighthouse
        run: |
          set -euo pipefail
          npx --yes lighthouse@12.2.1 https://nabzesardo.ir/             --quiet --chrome-flags="--headless --no-sandbox"             --output=json --output-path=mobile.json
          npx --yes lighthouse@12.2.1 https://nabzesardo.ir/             --quiet --preset=desktop --chrome-flags="--headless --no-sandbox"             --output=json --output-path=desktop.json
          python - <<'PY'
          import json
          for name in ["mobile","desktop"]:
              d=json.load(open(name+".json"))
              c=d["categories"]; a=d["audits"]
              print("LIGHTHOUSE",name,
                    "performance",round(c["performance"]["score"]*100),
                    "seo",round(c["seo"]["score"]*100),
                    "accessibility",round(c["accessibility"]["score"]*100),
                    "best",round(c["best-practices"]["score"]*100))
              for key in ["first-contentful-paint","largest-contentful-paint","speed-index","total-blocking-time","cumulative-layout-shift","server-response-time"]:
                  x=a.get(key,{})
                  print("METRIC",name,key,x.get("displayValue"),"score",x.get("score"))
          PY
          python - <<'PY'
          import json
          d=json.load(open("mobile.json"))
          a=d["audits"]
          for key in ["mainthread-work-breakdown","bootup-time","long-tasks","unused-javascript","render-blocking-resources","network-requests","diagnostics"]:
              x=a.get(key)
              if not x: continue
              print("AUDIT",key,"score",x.get("score"),"display",x.get("displayValue"))
              details=x.get("details") or {}
              items=details.get("items") or []
              if key=="bootup-time":
                  items=sorted(items,key=lambda i:i.get("total",0),reverse=True)[:10]
                  for i in items: print("BOOT",i.get("url"),i.get("total"),i.get("scripting"),i.get("scriptParseCompile"))
              elif key=="long-tasks":
                  items=sorted(items,key=lambda i:i.get("duration",0),reverse=True)[:10]
                  for i in items: print("LONG",i.get("url"),i.get("duration"),i.get("startTime"))
              elif key=="unused-javascript":
                  items=sorted(items,key=lambda i:i.get("wastedBytes",0),reverse=True)[:10]
                  for i in items: print("UNUSED_JS",i.get("url"),i.get("totalBytes"),i.get("wastedBytes"),i.get("wastedPercent"))
              elif key=="mainthread-work-breakdown":
                  for i in items: print("MAINTHREAD",i.get("groupLabel"),i.get("duration"))
              elif key=="diagnostics":
                  for i in items[:1]:
                      keep={k:i.get(k) for k in ["numRequests","numScripts","numStylesheets","numFonts","numTasks","numTasksOver10ms","numTasksOver25ms","numTasksOver50ms","numTasksOver100ms","numTasksOver500ms","totalByteWeight","mainDocumentTransferSize"]}
                      print("DIAGNOSTICS",keep)

          reqs=a.get("network-requests",{}).get("details",{}).get("items",[])
          reqs=sorted(reqs,key=lambda i:i.get("transferSize",0),reverse=True)[:15]
          for i in reqs:
              print("TOP_NETWORK",i.get("resourceType"),i.get("transferSize"),i.get("mimeType"),i.get("url"))
          PY

# post-v2 measurement trigger
