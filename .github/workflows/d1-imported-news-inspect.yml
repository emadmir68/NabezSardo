name: Inspect Imported Monitor Articles

on:
  push:
    branches:
      - diagnostic/news-monitor-live
    paths:
      - ".github/workflows/d1-imported-news-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Inspect imported articles in D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute nabzesardo-cloudflare-db --remote --command="SELECT json_extract(j.value,'$.id') AS id, json_extract(j.value,'$.title') AS title, json_extract(j.value,'$.lead') AS lead, json_extract(j.value,'$.sourceId') AS source_id, json_extract(j.value,'$.sourceUrl') AS source_url, json_extract(j.value,'$.ingestedAt') AS ingested_at FROM app_state, json_each(app_state.value,'$.articles') AS j WHERE app_state.key='db' AND json_extract(j.value,'$.imported')=1 ORDER BY json_extract(j.value,'$.ingestedAt') DESC LIMIT 20;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
