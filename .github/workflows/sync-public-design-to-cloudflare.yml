name: Sync Claude Design to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "public/claude-home.css"
      - "public/claude-home.js"
      - "public/claude-system.css"
      - "lib/view-home-claude.js"
      - ".github/workflows/sync-public-design-to-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-claude-design-to-cloudflare
  cancel-in-progress: true

jobs:
  sync-design:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout Cloudflare production branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0

      - name: Copy approved Claude design files from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- public/claude-home.css public/claude-home.js lib/view-home-claude.js
          if git cat-file -e origin/main:public/claude-system.css 2>/dev/null; then
            git checkout origin/main -- public/claude-system.css
          fi

          if git diff --cached --quiet && git diff --quiet; then
            echo "No Claude design changes to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/claude-home.css public/claude-home.js lib/view-home-claude.js
          if [ -f public/claude-system.css ]; then git add public/claude-system.css; fi
          git commit -m "Sync Claude design from main"
          git push origin HEAD:cloudflare-migration
