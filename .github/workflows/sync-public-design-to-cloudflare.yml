name: Sync Public Design to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "lib/view-public.js"
      - "lib/view-common.js"
      - ".github/workflows/sync-public-design-to-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-public-to-cloudflare
  cancel-in-progress: true

jobs:
  sync-design:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout Cloudflare migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0

      - name: Copy safe shared presentation files from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- public lib/view-public.js lib/view-common.js

          if git diff --cached --quiet && git diff --quiet; then
            echo "No public design changes to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public lib/view-public.js lib/view-common.js
          git commit -m "Sync public design from main"
          git push origin HEAD:cloudflare-migration
