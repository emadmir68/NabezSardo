name: Sync App to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "lib/**"
      - "public/**"
      - ".github/workflows/sync-public-design-to-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-to-cloudflare
  cancel-in-progress: true

jobs:
  sync-app:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Cloudflare migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0

      - name: Copy shared application code from main
        run: |
          set -euo pipefail
          git fetch origin main

          # Keep Cloudflare-specific worker/config files intact.
          git checkout origin/main -- app.js lib public

          if git diff --cached --quiet && git diff --quiet; then
            echo "No shared application changes to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js lib public
          git commit -m "Sync application from main to Cloudflare"
          git push origin HEAD:cloudflare-migration
