name: News Monitor Live Diagnostic

on:
  push:
    branches:
      - diagnostic/news-monitor-live

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read live monitor status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 https://nabzesardo.ir/__sync/status -o /tmp/status.json
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
          console.log(JSON.stringify({
            testedAt:new Date().toISOString(),
            newsMonitor:data.newsMonitor||null
          },null,2));
          NODE
