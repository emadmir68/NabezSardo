name: Deploy Nabez Sardo Cloudflare Worker

on:
  push:
    branches:
      - cloudflare-migration
    paths-ignore:
      - cloudflare-deploy-status.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nabzesardo-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cloudflare migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Publication regression tests
        run: npm test

      - name: Set unique asset version
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace(/"CLOUDFLARE_ASSET_VERSION"\s*:\s*"[^"]+"/, '"CLOUDFLARE_ASSET_VERSION": "'+process.env.GITHUB_SHA+'"');
          fs.writeFileSync(p,s);
          NODE

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for edge propagation
        run: sleep 12

      - name: Smoke test Cloudflare production
        shell: bash
        run: |
          set -euo pipefail
          WORKER="https://nabzesardo-cloudflare.emadmir1368.workers.dev"
          SITE="https://nabzesardo.ir"

          curl -fsS --retry 5 --retry-delay 3 "$WORKER/health" -o /tmp/worker-health.json
          curl -fsS --retry 5 --retry-delay 3 "$SITE/health" -o /tmp/site-health.json
          curl -fsS --retry 5 --retry-delay 3 "$SITE/" -o /tmp/home.html
          curl -fsS --retry 5 --retry-delay 3 "$SITE/all-news" -o /tmp/archive.html
          curl -fsS --retry 5 --retry-delay 3 "$SITE/sitemap.xml" -o /tmp/sitemap.xml
          curl -fsS --retry 5 --retry-delay 3 "$SITE/feed.xml" -o /tmp/feed.xml
          curl -fsS --retry 5 --retry-delay 3 "$SITE/admin/login" -o /tmp/admin-login.html
          curl -fsS --retry 5 --retry-delay 3 "$SITE/__cutover/status" -o /tmp/cutover.json

          grep -q "نبض ساردو" /tmp/home.html
          grep -q "نبض ساردو" /tmp/archive.html
          grep -q "<urlset" /tmp/sitemap.xml
          grep -q "<rss" /tmp/feed.xml
          grep -q "admin" /tmp/admin-login.html || grep -q "ورود" /tmp/admin-login.html

          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/home.html','utf8');
          const cards=[...html.matchAll(/<article\b[^>]*data-story-title-fa="([^"]*)"[^>]*data-story-url="(\/news\/[A-Za-z0-9_-]+)"[^>]*>/g)];
          if(!cards.length)throw new Error('Compact article URL missing from homepage');
          const seen=new Map();
          for(const [,title,path] of cards){
            if(seen.has(path)&&seen.get(path)!==title){
              throw new Error('One compact URL points to multiple homepage titles: '+path);
            }
            seen.set(path,title);
          }
          fs.writeFileSync('/tmp/short-path.txt',cards[0][2]);
          fs.writeFileSync('/tmp/short-title.txt',cards[0][1]);
          NODE
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/archive.html','utf8');
          const cards=[...html.matchAll(/<article\b[^>]*data-story-title-fa="([^"]*)"[^>]*data-story-url="(\/news\/[A-Za-z0-9_-]+)"[^>]*>/g)];
          if(!cards.length)throw new Error('No published news cards found in archive');
          const byPath=new Map();
          const byTitle=new Map();
          for(const [,title,path] of cards){
            if(byPath.has(path)&&byPath.get(path)!==title){
              throw new Error('Compact URL collision across published news: '+path);
            }
            if(byTitle.has(title)&&byTitle.get(title)!==path){
              // duplicate titles are allowed, but each card still needs its own path
            }
            byPath.set(path,title);
            byTitle.set(title,path);
          }
          if(byPath.size!==cards.length){
            throw new Error('Published news contains duplicate compact URLs');
          }
          console.log('published_compact_links='+cards.length);
          NODE
          short_path=$(cat /tmp/short-path.txt)
          echo "short_article_path=$short_path"
          case "$short_path" in
            /news/*) ;;
            *) echo "Unexpected compact article path: $short_path"; exit 1 ;;
          esac

          META_UA='facebookexternalhit/1.1 (+https://www.facebook.com/externalhit_uatext.php)'
          INSTAGRAM_UA='Instagram 350.0.0.0 Android'
          WHATSAPP_UA='WhatsApp/2.24 Android'
          TELEGRAM_UA='TelegramBot'
          RUBIKA_UA='Mozilla/5.0 (compatible; RubikaBot/1.0)'
          BALE_UA='Mozilla/5.0 (compatible; BaleBot/1.0)'

          require_meta() {
            label="$1"
            pattern="$2"
            file="$3"
            if ! grep -q "$pattern" "$file"; then
              echo "Missing social metadata: $label"
              grep -o '<meta[^>]*\(og:\|twitter:\)[^>]*>' "$file" | head -n 30 || true
              exit 1
            fi
          }

          for agent in "$META_UA" "$INSTAGRAM_UA" "$WHATSAPP_UA" "$TELEGRAM_UA" "$RUBIKA_UA" "$BALE_UA"; do
            head_code=$(curl -A "$agent" -sS -I -o /tmp/article-head.txt -w '%{http_code}' --max-time 30 "$SITE$short_path")
            echo "crawler_head agent=$agent status=$head_code"
            test "$head_code" = 200
            grep -qi '^content-type: text/html' /tmp/article-head.txt
            if grep -qi '^location:' /tmp/article-head.txt; then
              echo "Compact article URL must not redirect for social crawlers"
              cat /tmp/article-head.txt
              exit 1
            fi
            get_code=$(curl -A "$agent" -sS -o /tmp/article-get.html -w '%{http_code}' --max-time 30 "$SITE$short_path")
            echo "crawler_get agent=$agent status=$get_code"
            test "$get_code" = 200
            require_meta "og:type" 'property="og:type" content="article"' /tmp/article-get.html
            require_meta "og:title" 'property="og:title" content="[^"]\+"' /tmp/article-get.html
            require_meta "og:description" 'property="og:description" content="[^"]\+"' /tmp/article-get.html
            require_meta "og:image-local" 'property="og:image" content="https://nabzesardo.ir/' /tmp/article-get.html
            if ! grep -Fq "property=\"og:url\" content=\"$SITE$short_path\"" /tmp/article-get.html; then
              echo "Missing social metadata: og:url exact compact URL"
              grep -o '<meta[^>]*property="og:url"[^>]*>' /tmp/article-get.html | head -n 5 || true
              exit 1
            fi
          done

          curl -A "$META_UA" -fsS --retry 5 --retry-delay 3 "$SITE$short_path" -o /tmp/short-article.html
          grep -q 'data-article-root' /tmp/short-article.html
          grep -Fq "data-article-url=\"$short_path\"" /tmp/short-article.html
          grep -q 'property="og:type" content="article"' /tmp/short-article.html
          grep -q 'property="og:title" content="[^"]\+"' /tmp/short-article.html
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/short-article.html','utf8');
          const expected=fs.readFileSync('/tmp/short-title.txt','utf8');
          const match=html.match(/property="og:title" content="([^"]*)"/);
          if(!match)throw new Error('Missing og:title on compact article');
          if(match[1]!==expected)throw new Error('Compact URL/title mismatch: expected '+expected+' got '+match[1]);
          NODE
          grep -q 'property="og:description" content="[^"]\+"' /tmp/short-article.html
          grep -Fq "property=\"og:url\" content=\"$SITE$short_path\"" /tmp/short-article.html
          grep -q 'rel="canonical" href="https://nabzesardo.ir/news/' /tmp/short-article.html
          grep -q 'property="og:image" content="https://nabzesardo.ir/' /tmp/short-article.html
          grep -q 'property="og:image:secure_url" content="https://nabzesardo.ir/' /tmp/short-article.html
          grep -q 'property="og:image:alt" content="[^"]\+"' /tmp/short-article.html
          grep -q 'name="twitter:card" content="summary_large_image"' /tmp/short-article.html

          og_image=$(sed -n 's/.*property="og:image" content="\([^"]*\)".*/\1/p' /tmp/short-article.html | head -n 1)
          if [ -z "$og_image" ]; then
            echo "Missing social preview image"
            exit 1
          fi
          case "$og_image" in
            *.svg|*.svg\?*) echo "Social preview image must be raster, got SVG: $og_image"; exit 1 ;;
          esac
          image_code=$(curl -A "$META_UA" -sS -D /tmp/og-image.headers -o /tmp/og-image.bin -w '%{http_code}' --max-time 45 "$og_image")
          image_type=$(tr -d '\r' < /tmp/og-image.headers | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}' | tail -n1)
          echo "social_preview_image=$og_image status=$image_code type=$image_type"
          test "$image_code" = 200
          test -s /tmp/og-image.bin
          echo "$image_type" | grep -Eq '^image/(png|jpeg|jpg|webp|gif)'

          node <<'NODE'
          const fs=require('fs');
          const worker=JSON.parse(fs.readFileSync('/tmp/worker-health.json','utf8'));
          const site=JSON.parse(fs.readFileSync('/tmp/site-health.json','utf8'));
          const cut=JSON.parse(fs.readFileSync('/tmp/cutover.json','utf8'));
          const problems=[];
          if(worker.origin!=='cloudflare'||worker.railwayDependency!==false) problems.push('worker-health-not-independent');
          if(site.origin!=='cloudflare'||site.railwayDependency!==false) problems.push('site-health-not-independent');
          if(cut.cloudflarePrimary!==true) problems.push('cloudflare-not-primary');
          if(cut.railwayDependency!==false) problems.push('railway-dependency-present');
          if(cut.adminReady!==true) problems.push('admin-not-ready');
          if(cut.storage?.arvanConfigured!==true) problems.push('arvan-not-configured');
          if(cut.storage?.arvanAuthenticated!==true) problems.push('arvan-not-authenticated');
          if(cut.storage?.lastError) problems.push('arvan-last-error:'+cut.storage.lastError);
          if(cut.backup?.lastError) problems.push('backup-last-error:'+cut.backup.lastError);
          const report={
            testedAt:new Date().toISOString(),
            commit:process.env.GITHUB_SHA,
            workerHealth:worker,
            siteHealth:site,
            cutover:cut,
            readyForRailwayShutdown:problems.length===0 && cut.readyForRailwayShutdown===true,
            problems
          };
          fs.writeFileSync('cloudflare-deploy-status.json',JSON.stringify(report,null,2)+'\n');
          if(problems.length){
            console.error(JSON.stringify(report,null,2));
            process.exit(1);
          }
          NODE

      - name: Record verified cutover status
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nabez-sardo-cloudflare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare-deploy-status.json
          git commit -m "Record verified Cloudflare-only deployment [skip ci]" || exit 0
          git push origin HEAD:cloudflare-migration
