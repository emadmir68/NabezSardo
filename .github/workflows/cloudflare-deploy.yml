name: Deploy Nabez Sardo Cloudflare Worker

on:
  push:
    branches:
      - cloudflare-migration
    paths-ignore:
      - cloudflare-deploy-status.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nabzesardo-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cloudflare migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Detach DNS from Railway origin
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          DOMAIN="nabzesardo.ir"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          zones="$(curl -fsS "${AUTH[@]}" "$API/zones?name=$DOMAIN&account.id=$CLOUDFLARE_ACCOUNT_ID")"
          ZONE_ID="$(printf '%s' "$zones" | jq -r '.result[0].id // empty')"
          test -n "$ZONE_ID"
          printf '%s' "$ZONE_ID" > .cutover-zone-id

          records="$(curl -fsS "${AUTH[@]}" "$API/zones/$ZONE_ID/dns_records?name=$DOMAIN&per_page=100")"
          printf '%s' "$records" > .cutover-dns-list.json

          railway_record="$(printf '%s' "$records" | jq -c '[.result[] | select(.name=="nabzesardo.ir" and .type=="CNAME" and ((.content // "") | test("railway\\.app$|up\\.railway\\.app$";"i")))] | first // empty')"

          if [ -n "$railway_record" ]; then
            printf '%s' "$railway_record" > .cutover-dns-before.json
            RECORD_ID="$(printf '%s' "$railway_record" | jq -r '.id')"
            payload='{"type":"AAAA","name":"nabzesardo.ir","content":"100::","ttl":1,"proxied":true,"comment":"Nabez Sardo Cloudflare-only originless cutover"}'
            changed="$(curl -fsS -X PUT "${AUTH[@]}" --data "$payload" "$API/zones/$ZONE_ID/dns_records/$RECORD_ID")"
            printf '%s' "$changed" | jq -e '.success==true' >/dev/null
            printf '%s\n' '{"railwayDetached":true,"mode":"originless-placeholder","record":"AAAA 100::","proxied":true}' > .cutover-dns-status.json
          else
            if printf '%s' "$records" | jq -e '.result[] | select(.name=="nabzesardo.ir" and .type=="AAAA" and .content=="100::" and .proxied==true)' >/dev/null; then
              printf '%s\n' '{"railwayDetached":true,"mode":"already-originless","record":"AAAA 100::","proxied":true}' > .cutover-dns-status.json
            elif printf '%s' "$records" | jq -e '.result[] | select(.name=="nabzesardo.ir" and ((.content // "") | test("railway\\.app|up\\.railway\\.app";"i")))' >/dev/null; then
              echo "Unexpected Railway DNS record type; refusing unsafe automatic mutation." >&2
              exit 1
            else
              printf '%s\n' '{"railwayDetached":true,"mode":"already-non-railway"}' > .cutover-dns-status.json
            fi
          fi

      - name: Wait for edge propagation
        run: sleep 12

      - name: Smoke test Cloudflare production
        shell: bash
        run: |
          set -euo pipefail
          WORKER="https://nabzesardo-cloudflare.emadmir1368.workers.dev"
          SITE="https://nabzesardo.ir"

          curl -fsS --retry 5 --retry-delay 3 "$WORKER/health" -o /tmp/worker-health.json
          curl -fsS --retry 5 --retry-delay 3 "$SITE/health" -o /tmp/site-health.json
          curl -fsS --retry 5 --retry-delay 3 "$SITE/" -o /tmp/home.html
          curl -fsS --retry 5 --retry-delay 3 "$SITE/all-news" -o /tmp/archive.html
          curl -fsS --retry 5 --retry-delay 3 "$SITE/sitemap.xml" -o /tmp/sitemap.xml
          curl -fsS --retry 5 --retry-delay 3 "$SITE/feed.xml" -o /tmp/feed.xml
          curl -fsS --retry 5 --retry-delay 3 "$SITE/admin/login" -o /tmp/admin-login.html
          curl -fsS --retry 5 --retry-delay 3 "$SITE/__cutover/status" -o /tmp/cutover.json

          grep -q "نبض ساردو" /tmp/home.html
          grep -q "نبض ساردو" /tmp/archive.html
          grep -q "<urlset" /tmp/sitemap.xml
          grep -q "<rss" /tmp/feed.xml
          grep -q "admin" /tmp/admin-login.html || grep -q "ورود" /tmp/admin-login.html

          node <<'NODE'
          const fs=require('fs');
          const worker=JSON.parse(fs.readFileSync('/tmp/worker-health.json','utf8'));
          const site=JSON.parse(fs.readFileSync('/tmp/site-health.json','utf8'));
          const cut=JSON.parse(fs.readFileSync('/tmp/cutover.json','utf8'));
          const dns=fs.existsSync('.cutover-dns-status.json')?JSON.parse(fs.readFileSync('.cutover-dns-status.json','utf8')):{railwayDetached:false,mode:'unknown'};
          const problems=[];
          if(worker.origin!=='cloudflare'||worker.railwayDependency!==false) problems.push('worker-health-not-independent');
          if(site.origin!=='cloudflare'||site.railwayDependency!==false) problems.push('site-health-not-independent');
          if(cut.cloudflarePrimary!==true) problems.push('cloudflare-not-primary');
          if(cut.railwayDependency!==false) problems.push('railway-dependency-present');
          if(cut.adminReady!==true) problems.push('admin-not-ready');
          if(cut.storage?.arvanConfigured!==true) problems.push('arvan-not-configured');
          if(cut.storage?.arvanAuthenticated!==true) problems.push('arvan-not-authenticated');
          if(cut.storage?.lastError) problems.push('arvan-last-error:'+cut.storage.lastError);
          if(cut.backup?.lastError) problems.push('backup-last-error:'+cut.backup.lastError);
          if(dns.railwayDetached!==true) problems.push('dns-still-railway-dependent');
          const report={
            testedAt:new Date().toISOString(),
            commit:process.env.GITHUB_SHA,
            workerHealth:worker,
            siteHealth:site,
            dns,
            cutover:cut,
            readyForRailwayShutdown:problems.length===0 && cut.readyForRailwayShutdown===true,
            problems
          };
          fs.writeFileSync('cloudflare-deploy-status.json',JSON.stringify(report,null,2)+'\n');
          if(problems.length){
            console.error(JSON.stringify(report,null,2));
            process.exit(1);
          }
          NODE

      - name: Roll back DNS if cutover smoke test fails
        if: failure()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f .cutover-dns-before.json ] || [ ! -f .cutover-zone-id ]; then
            echo "No DNS mutation to roll back."
            exit 0
          fi
          API="https://api.cloudflare.com/client/v4"
          ZONE_ID="$(cat .cutover-zone-id)"
          original="$(cat .cutover-dns-before.json)"
          RECORD_ID="$(printf '%s' "$original" | jq -r '.id')"
          payload="$(printf '%s' "$original" | jq -c '{type,name,content,ttl,proxied,comment,tags}')"
          curl -fsS -X PUT             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data "$payload"             "$API/zones/$ZONE_ID/dns_records/$RECORD_ID" | jq -e '.success==true' >/dev/null
          echo "Railway DNS record restored because smoke test failed."

      - name: Record verified cutover status
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nabez-sardo-cloudflare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare-deploy-status.json
          git commit -m "Record verified Cloudflare-only deployment [skip ci]" || exit 0
          git push origin HEAD:cloudflare-migration
