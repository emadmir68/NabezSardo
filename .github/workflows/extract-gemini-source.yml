name: Extract original Gemini source for integration
on:
  push:
    branches: [preview/gemini-design-2026-11-21]
    paths: [".github/workflows/extract-gemini-source.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/gemini-design-2026-11-21
          fetch-depth: 0
      - run: |
          set -euo pipefail
          mkdir -p /tmp/nabz-source
          unzip -q nabz-sardo-original-gemini-design.zip -d /tmp/nabz-source
          mkdir -p gemini-source
          cd /tmp/nabz-source
          find src -type f ! -path '*/images/*' -print0 | while IFS= read -r -d '' file; do mkdir -p "$GITHUB_WORKSPACE/gemini-source/$(dirname "$file")"; cp "$file" "$GITHUB_WORKSPACE/gemini-source/$file"; done
          cp package.json index.html vite.config.ts tsconfig.json "$GITHUB_WORKSPACE/gemini-source/"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini-source
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract exact Gemini text sources for backend integration"
          git push origin HEAD:preview/gemini-design-2026-11-21
